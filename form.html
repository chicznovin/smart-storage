<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Storage</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: #fff;
  background-color: #0b1f13;
}

header {
  background: #145c14;
  color: #fff;
  padding: 20px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.5);
}

nav {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-top: 10px;
  flex-wrap: wrap;
}

nav a {
  color: #d4ffd4;
  text-decoration: none;
  font-weight: bold;
  transition: color 0.3s;
}

nav a:hover {
  color: #fff;
}

#area-produtor {
  background: #f5f5f5;
  color: #333;
  margin: 50px auto;
  padding: 30px;
  border-radius: 16px;
  max-width: 600px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}

#area-produtor i {
  font-size: 48px;
  margin-bottom: 20px;
  color: #145c14;
}

h2 {
  color: #145c14;
  border-left: 6px solid #228B22;
  padding-left: 10px;
  margin-top: 0;
}

.btn {
  background: #228B22;
  color: #fff;
  border: none;
  padding: 12px 24px;
  margin-top: 15px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 16px;
  transition: all 0.3s;
}

.btn:hover {
  background: #145c14;
  transform: scale(1.05);
}

form {
  width: 100%;
  display: grid;
  gap: 15px;
}

label {
  font-weight: bold;
  text-align: left;
  display: block;
}

input, textarea, select {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 8px;
  width: 100%;
  font-size: 14px;
}

footer {
  background: #145c14;
  color: #fff;
  text-align: center;
  padding: 20px;
  margin-top: 30px;
}

@media (max-width: 600px) {
  #area-produtor {
    margin: 30px 10px;
    padding: 20px;
  }
}
</style>
</head>
<body>
<header>
  <h1>🌱 Smart Storage</h1>
  <p>Organização inteligente para sua produção rural</p>
  <nav>
    <a href="#sobre">Sobre nós</a>
    <a href="#servicos">Serviços</a>
    <a href="#como">Como funciona</a>
    <a href="#area-produtor">Área do produtor</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section id="area-produtor">
  <i class="fas fa-tractor"></i>
  <form id="form-producao">
    <h2>Área do produtor</h2>

    <label for="cultura">Cultura:</label>
    <select id="cultura" name="cultura" required>
      <option value="">Selecione</option>
      <option>Milho</option>
      <option>Soja</option>
      <option>Café</option>
      <option>Outro</option>
    </select>

    <label for="area">Área plantada (ha):</label>
    <input id="area" name="area" type="number" placeholder="Ex: 10" required>

    <label for="custos">Custos de insumo (R$):</label>
    <input id="custos" name="custos" type="number" placeholder="Ex: 5000" required>

    <label for="producao">Produção esperada (kg/sacas):</label>
    <input id="producao" name="producao" type="number" placeholder="Ex: 2000" required>

    <label for="preco">Preço de venda (R$/kg):</label>
    <input id="preco" name="preco" type="number" step="0.01" placeholder="Ex: 3.5" required>

    <label for="plantio">Data de plantio:</label>
    <input id="plantio" name="plantio" type="date" required>

    <label for="colheita">Data de colheita:</label>
    <input id="colheita" name="colheita" type="date" required>

    <label for="obs">Observações:</label>
    <textarea id="obs" name="obs" rows="4"></textarea>

    <button type="button" class="btn" id="btn-gerar">Gerar PDF</button>
  </form>
</section>

<footer>
© 2025 Smart Storage - Todos os direitos reservados.
</footer>

<script>
async function gerarPDF() {
  const btn = document.getElementById("btn-gerar");
  btn.disabled = true;
  btn.textContent = "Gerando PDF...";

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF('p','mm','a4');
  const form = document.getElementById("form-producao");

  // Validação
  if (!form.cultura.value || !form.area.value || !form.custos.value || !form.producao.value || !form.plantio.value || !form.colheita.value || !form.preco.value) {
    alert("Preencha todos os campos obrigatórios!");
    btn.disabled = false;
    btn.textContent = "Gerar PDF";
    return;
  }

  const formatCurrency = value => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(value);
  const formatDate = date => new Date(date).toLocaleDateString('pt-BR');

  // Dados principais
  const dados = [
    ["Cultura", form.cultura.value],
    ["Área Plantada (ha)", form.area.value],
    ["Custos de Insumo (R$)", formatCurrency(form.custos.value)],
    ["Produção Esperada (kg/sacas)", form.producao.value],
    ["Data de Plantio", formatDate(form.plantio.value)],
    ["Data de Colheita", formatDate(form.colheita.value)],
    ["Observações", form.obs.value || "-"]
  ];

  // Cálculos de lucro
  const producao = parseFloat(form.producao.value);
  const precoVenda = parseFloat(form.preco.value);
  const custos = parseFloat(form.custos.value);
  const receitaBruta = producao * precoVenda;
  const lucro = receitaBruta - custos;
  const margem = receitaBruta ? (lucro / receitaBruta) * 100 : 0;

  const dadosFinanceiros = [
    ["Receita Bruta (R$)", formatCurrency(receitaBruta)],
    ["Lucro Líquido (R$)", formatCurrency(lucro)],
    ["Margem (%)", margem.toFixed(2) + "%"]
  ];

  // Título
  doc.setFont("helvetica","bold");
  doc.setFontSize(22);
  doc.setTextColor(20,100,20);
  const title = "Relatório de Produção";
  const pageWidth = doc.internal.pageSize.getWidth();
  const titleWidth = doc.getTextWidth(title);
  doc.text(title, (pageWidth - titleWidth)/2, 25);

  // Tabela principal
  doc.autoTable({
    startY: 40,
    head: [['Campo', 'Valor']],
    body: dados,
    theme: 'grid',
    headStyles: { fillColor: [34,139,34], textColor: 255, fontStyle: 'bold', halign: 'center' },
    bodyStyles: { font: "helvetica", fontStyle: "normal", fontSize: 12, valign: 'middle' },
    alternateRowStyles: { fillColor: [245,255,245] },
    columnStyles: { 0: { cellWidth: 60, halign: 'left' }, 1: { cellWidth: 120, halign: 'left' } },
    tableLineColor: [0,0,0],
    tableLineWidth: 0.5,
    styles: { cellPadding: 6, overflow: 'linebreak' }
  });

  // Tabela financeira destacada
  doc.autoTable({
    startY: doc.lastAutoTable.finalY + 12,
    head: [['Financeiro', 'Valor']],
    body: dadosFinanceiros,
    theme: 'grid',
    headStyles: { fillColor: [34,139,34], textColor: 255, fontStyle: 'bold', halign: 'center' },
    bodyStyles: { font: "helvetica", fontStyle: "bold", fontSize: 12, valign: 'middle', textColor: [0, 50, 0] },
    alternateRowStyles: { fillColor: [220, 255, 220] },
    columnStyles: { 0: { cellWidth: 60, halign: 'left' }, 1: { cellWidth: 120, halign: 'left' } },
    tableLineColor: [0,100,0],
    tableLineWidth: 0.7,
    styles: { cellPadding: 6, overflow: 'linebreak', halign: 'center', valign: 'middle' },
    didDrawPage: (data) => {
      const page = doc.internal.getNumberOfPages();
      doc.setFontSize(10);
      doc.setTextColor(100);
      doc.text(`Emitido em: ${formatDate(new Date())}`, 14, doc.internal.pageSize.getHeight() - 10);
      doc.text(`Página ${page}`, doc.internal.pageSize.getWidth() - 30, doc.internal.pageSize.getHeight() - 10);
    }
  });

  doc.save("relatorio_producao.pdf");
  btn.disabled = false;
  btn.textContent = "Gerar PDF";
}

document.getElementById("btn-gerar").addEventListener("click", gerarPDF);
</script>
</body>
</html>
